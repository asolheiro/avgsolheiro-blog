<!-- Static "my apps" modal, injected at the theme's body-extensions hook.
     Triggered by the "Apps" link added to the top nav (layouts/partials/header.html).
     Colors mirror the theme's own light/dark palette (assets/scss/_variables.scss)
     instead of undefined CSS custom properties, following the same
     body.colorscheme-{dark,auto} pattern the theme itself uses. -->
<style>
  #my-apps-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1001;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  #my-apps-overlay.open {
    display: flex;
  }
  #my-apps-modal {
    width: 100%;
    max-width: 360px;
    background: #fafafa;
    color: #212121;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  }
  #my-apps-modal .my-apps-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  #my-apps-modal a.my-app-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0.9rem 1rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    text-decoration: none;
    color: inherit;
    font-weight: 600;
    transition: border-color 0.15s ease;
  }
  #my-apps-modal a.my-app-link:hover {
    border-color: #1565c0;
  }
  #my-apps-modal a.my-app-link small {
    display: block;
    font-weight: 400;
    opacity: 0.7;
    margin-top: 0.25rem;
  }
  #my-apps-close {
    margin-top: 1.25rem;
    width: 100%;
    padding: 0.6rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: transparent;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
  }

  body.colorscheme-dark #my-apps-modal {
    background: #212121;
    color: #dadada;
  }
  body.colorscheme-dark #my-apps-modal a.my-app-link,
  body.colorscheme-dark #my-apps-close {
    border-color: #4f4f4f;
  }
  body.colorscheme-dark #my-apps-modal a.my-app-link:hover {
    border-color: #42a5f5;
  }

  @media (prefers-color-scheme: dark) {
    body.colorscheme-auto #my-apps-modal {
      background: #212121;
      color: #dadada;
    }
    body.colorscheme-auto #my-apps-modal a.my-app-link,
    body.colorscheme-auto #my-apps-close {
      border-color: #4f4f4f;
    }
    body.colorscheme-auto #my-apps-modal a.my-app-link:hover {
      border-color: #42a5f5;
    }
  }
</style>

<div id="my-apps-overlay" role="dialog" aria-modal="true" aria-label="Meus apps">
  <div id="my-apps-modal">
    <div class="my-apps-list">
      <a class="my-app-link" href="https://e-ile.armandosolheiro.xyz" target="_blank" rel="noopener">
        E-ilê
        <small>Gestão para terreiros de candomblé</small>
      </a>
      <a class="my-app-link" href="https://securo.armandosolheiro.xyz" target="_blank" rel="noopener">
        Securo
        <small>Controle financeiro pessoal</small>
      </a>
      <a class="my-app-link" href="https://affine.armandosolheiro.xyz" target="_blank" rel="noopener">
        AFFiNE
        <small>Workspace estilo Notion, self-hosted</small>
      </a>
      <a class="my-app-link" href="https://tec-sheets.armandosolheiro.xyz" target="_blank" rel="noopener">
        Iris PDV
        <small>Fork pessoal do useiris — PDV multi-tenant</small>
      </a>
    </div>
    <button id="my-apps-close" type="button">Fechar</button>
  </div>
</div>

<script>
  (function () {
    var trigger = document.getElementById("my-apps-trigger");
    var overlay = document.getElementById("my-apps-overlay");
    var closeBtn = document.getElementById("my-apps-close");

    function open(e) {
      if (e) e.preventDefault();
      overlay.classList.add("open");
    }
    function close() {
      overlay.classList.remove("open");
    }

    trigger.addEventListener("click", open);
    closeBtn.addEventListener("click", close);
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") close();
    });
  })();
</script>
