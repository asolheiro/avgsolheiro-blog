apiVersion: v1
kind: Service
metadata:
  name: {{ include "blog.fullname" . }}
  namespace: blog
  labels:
    {{- include "blog.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blog
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
