{{- if .Values.networkPolicy.enabled }}
# Ingress-only isolation: closes the "any pod in the cluster can reach this
# namespace" gap without touching egress — see infra audit finding. Blog is a
# static site with no backing services, so the same-namespace rule mostly
# exists for consistency with the other charts, not because it's load-bearing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blog.fullname" . }}-default-deny-ingress
  namespace: blog
  labels:
    {{- include "blog.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blog.fullname" . }}-allow-same-namespace
  namespace: blog
  labels:
    {{- include "blog.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blog.fullname" . }}-allow-ingress-controller
  namespace: blog
  labels:
    {{- include "blog.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: 80
{{- end }}
