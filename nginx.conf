server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS in front of this pod; these headers are safe to
    # send over both HTTP and HTTPS since they only take effect in the
    # browser once a page is actually loaded over HTTPS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Hugo's chroma syntax highlighter emits inline style="" on code spans
    # (style-src 'unsafe-inline'), and post pages embed Disqus comments via
    # an inline loader script that injects embed.js from <shortname>.disqus.com
    # (script-src 'unsafe-inline' + disqus.com; frame-src/img-src for the
    # comment iframe and avatar images). Everything else this site serves is
    # same-origin static assets.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.disquscdn.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://*.disqus.com; frame-src https://disqus.com https://*.disqus.com; connect-src 'self' https://*.disqus.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
