name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: container-registry.br-se1.magalu.cloud/asolheiro-registry

jobs:
  build:
    name: Build & Push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA tag
        id: sha
        run: echo "tag=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/blog:${{ steps.sha.outputs.tag }}
            ${{ env.REGISTRY }}/blog:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build
    environment: production
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Helm upgrade
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          cat > /tmp/registry-creds.yaml <<EOF
          imageCredentials:
            enabled: true
            registry: "${REGISTRY}"
            username: "${REGISTRY_USERNAME}"
            password: "${REGISTRY_PASSWORD}"
          EOF

          helm upgrade --install blog ./charts/blog \
            --namespace blog \
            --create-namespace \
            --values ./charts/blog/values-prod.yaml \
            --values /tmp/registry-creds.yaml \
            --set image.tag="${TAG}" \
            --wait \
            --timeout 5m \
            --history-max 5

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/blog -n blog --timeout=3m
          echo ""
          kubectl get pods -n blog
          echo ""
          echo "https://armandosolheiro.xyz"
